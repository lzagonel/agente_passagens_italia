name: Monitor de passagens Italia

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dados/rotas_monitoramento.json"
      - "monitor_diario.py"
      - "agente_passagens_italia.py"
      - ".github/workflows/monitor-passagens.yml"
  schedule:
    # 08:00, 14:00 e 20:00 no horario de Sao Paulo (UTC-3).
    - cron: "0 11,17,23 * * *"

permissions:
  contents: read
  issues: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar monitoramento
        id: monitor
        shell: bash
        run: |
          mkdir -p resultados
          python monitor_diario.py --consultar-web --salvar --json-saida resultados/monitoramento.json | tee resultados/relatorio.txt

          if python - <<'PY'
          import json
          dados = json.load(open("resultados/monitoramento.json", encoding="utf-8"))
          raise SystemExit(0 if dados.get("alertas") else 1)
          PY
          then
            echo "tem_alerta=true" >> "$GITHUB_OUTPUT"
          else
            echo "tem_alerta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar resumo no GitHub Actions
        shell: bash
        run: |
          {
            echo "## Relatorio diario de passagens"
            echo
            cat resultados/relatorio.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar relatorio como artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-passagens
          path: resultados/

      - name: Criar issue quando bater preco alvo
        if: steps.monitor.outputs.tem_alerta == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const dados = JSON.parse(fs.readFileSync("resultados/monitoramento.json", "utf8"));
            const relatorio = fs.readFileSync("resultados/relatorio.txt", "utf8");
            const titulo = `Alerta de passagem Italia - ${dados.gerado_em}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titulo,
              body: "Preco alvo encontrado ou superado.\n\n```text\n" + relatorio.slice(0, 6000) + "\n```"
            });

      - name: Preparar corpo do email
        if: steps.monitor.outputs.tem_alerta == 'true' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.EMAIL_TO != ''
        id: email_body
        shell: bash
        run: |
          {
            echo "texto<<EOF"
            cat resultados/relatorio.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Enviar email do relatorio
        if: steps.monitor.outputs.tem_alerta == 'true' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.EMAIL_TO != ''
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: Alerta de preco - passagens Italia
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}
          body: ${{ steps.email_body.outputs.texto }}
